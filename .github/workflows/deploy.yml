name: Deploy AI Desk Hub to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 08:17 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "17 0 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local rules and feed validation
        run: |
          python3 scripts/test-feeds.py
          python3 scripts/test-hotlist.py
          node --test content-studio/cloud/worker.test.mjs scripts/test-studio-transport.cjs scripts/test-ambient-video.cjs scripts/test-card-media.cjs scripts/test-feishu-controls.cjs scripts/test-workday.cjs scripts/test-intake.cjs scripts/test-device-sync.cjs scripts/test-sync-preferences.cjs scripts/test-project-cards.cjs sync-service/worker.test.mjs
      - name: Refresh daily topics and AI Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-feeds.py --restore-published
      - name: Validate and stage public files
        run: node scripts/prepare-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              });
              if (data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.info('Pages artifact is visible to the deployment API.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact did not become visible; no deployment attempted.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
