name: Deploy AI Desk Hub to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 08:17 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "17 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local rules and feed validation
        run: |
          python3 scripts/test-feeds.py
          python3 scripts/test-hotlist.py
          node --test scripts/test-workday.cjs scripts/test-intake.cjs scripts/test-device-sync.cjs sync-service/worker.test.mjs
      - name: Refresh daily topics and AI Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-feeds.py --restore-published
      - name: Validate and stage public files
        run: node scripts/prepare-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
